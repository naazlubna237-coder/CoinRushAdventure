plugins { id 'com.android.application' }

android {
    namespace 'com.coinrush.adventure'
    compileSdk 35

    defaultConfig {
        applicationId 'com.coinrush.adventure'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // Production Play signing. Set these in ~/.gradle/gradle.properties or
            // pass them with -P...; never commit your keystore or passwords.
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.create('releaseConfigured') {
                    storeFile file(project.property('RELEASE_STORE_FILE'))
                    storePassword project.findProperty('RELEASE_STORE_PASSWORD') ?: ''
                    keyAlias project.findProperty('RELEASE_KEY_ALIAS') ?: ''
                    keyPassword project.findProperty('RELEASE_KEY_PASSWORD') ?: ''
                }
            }
        }
    }

    packaging {
        resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
}
